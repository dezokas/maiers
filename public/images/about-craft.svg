<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <rect width="600" height="600" rx="24" fill="#0F172A" />
  
  <defs>
    <linearGradient id="craftGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <circle cx="300" cy="300" r="220" fill="url(#craftGlow)" />
  <circle cx="300" cy="300" r="170" stroke="#F97316" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="4 6" />

  <!-- Craftsmanship / Engineering Exploded Anatomy Representation -->
  <g transform="translate(100, 150)">
    <!-- Sole layer -->
    <path d="M 40 220 C 120 225, 260 225, 360 190 C 370 185, 360 170, 340 175 C 240 195, 120 200, 30 190 C 20 205, 30 218, 40 220 Z" fill="#334155" stroke="#475569" stroke-width="2" />
    <text x="380" y="200" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">01. High-Grip Outsole</text>
    <line x1="340" y1="180" x2="375" y2="195" stroke="#F97316" stroke-width="1.5" />

    <!-- Insole Memory Foam Layer -->
    <path d="M 50 160 C 130 165, 260 160, 350 135 C 360 130, 350 115, 330 120 C 240 140, 120 145, 40 135 C 35 150, 42 158, 50 160 Z" fill="url(#accentG)" />
    <text x="380" y="140" fill="#F97316" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">02. Ergonomic Cushioning</text>
    <line x1="330" y1="125" x2="375" y2="135" stroke="#F97316" stroke-width="1.5" />

    <!-- Upper Body Shell -->
    <path d="M 60 90 C 90 40, 160 10, 240 30 C 280 60, 320 80, 350 90 C 320 105, 220 115, 60 90 Z" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <text x="380" y="80" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">03. Handcrafted Upper</text>
    <line x1="320" y1="65" x2="375" y2="75" stroke="#F97316" stroke-width="1.5" />

    <!-- Precision Needle & Thread Symbol -->
    <path d="M 120 40 L 140 10" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="140" cy="10" r="3" fill="#F97316" />
  </g>

  <!-- Centered Stamp -->
  <g transform="translate(200, 460)">
    <rect width="200" height="42" rx="21" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="100" y="26" text-anchor="middle" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="1">100% QUALITY GUARANTEED</text>
  </g>
</svg>