<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <rect width="600" height="450" rx="16" fill="#F8FAFC" />
  <circle cx="300" cy="225" r="140" fill="#78350F" fill-opacity="0.08" />
  <ellipse cx="300" cy="360" rx="180" ry="20" fill="#0F172A" fill-opacity="0.08" />
  <g transform="translate(70, 70)">
    <!-- Lugged Vibram Style High Grip Outsole -->
    <path d="M 45 250 C 130 255, 230 255, 330 235 C 405 210, 425 185, 410 170 C 330 185, 220 205, 120 210 C 60 212, 40 230, 45 250 Z" fill="#1C1917" stroke="#44403C" stroke-width="2" />
    <!-- Lug teeth -->
    <polygon points="90,250 100,260 110,250" fill="#EA580C" />
    <polygon points="140,250 150,260 160,250" fill="#EA580C" />
    <polygon points="190,250 200,260 210,250" fill="#EA580C" />
    <polygon points="240,248 250,258 260,248" fill="#EA580C" />
    <!-- Rugged Sand Suede Upper with Ripstop Panels -->
    <path d="M 55 215 C 75 155, 125 105, 180 80 C 205 70, 235 95, 250 120 C 290 145, 360 165, 400 170 C 350 185, 240 195, 120 205 C 75 208, 60 210, 55 215 Z" fill="#D97706" />
    <!-- Mudguard Protective Overlay -->
    <path d="M 55 215 C 100 205, 200 195, 280 180 C 340 170, 385 168, 400 170 C 350 185, 240 195, 120 205 Z" fill="#78350F" />
    <!-- Rope Hiking Laces & Metal Speedhooks -->
    <g stroke="#FDE047" stroke-width="3" stroke-linecap="round">
      <line x1="195" y1="95" x2="225" y2="110" />
      <line x1="210" y1="110" x2="240" y2="125" />
      <line x1="225" y1="125" x2="255" y2="140" />
    </g>
    <circle cx="195" cy="95" r="2.5" fill="#1C1917" />
    <circle cx="210" cy="110" r="2.5" fill="#1C1917" />
    <circle cx="225" cy="125" r="2.5" fill="#1C1917" />
  </g>
  <text x="540" y="50" text-anchor="end" fill="#B45309" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">TRAIL / OUTDOOR</text>
</svg>